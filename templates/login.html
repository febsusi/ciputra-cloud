{% extends "base.html" %}{% block title %}Login · recruitment.ai{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><h2 class="fw-bold">Selamat datang</h2><p class="muted">Login ke recruitment.ai</p>
<form method="post"><div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required autocomplete="email"></div>
<div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required autocomplete="current-password"></div>
<button class="btn btn-primary w-100">Login</button></form>
<hr><p class="small muted">Belum punya akun? <a href="{{ url_for('register') }}">Register</a></p>
<details><summary class="small">Email belum diverifikasi?</summary><form method="post" action="{{ url_for('resend_verification') }}" class="mt-3">
<div class="mb-2"><input type="email" name="email" class="form-control" placeholder="Email" required></div>
<div class="mb-2"><input type="password" name="password" class="form-control" placeholder="Password untuk verifikasi akun" required></div>
<button class="btn btn-outline-secondary w-100">Kirim ulang verifikasi</button></form></details>
</div></div>{% endblock %}
